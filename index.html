<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>筋肥大ボリューム・ロードロガー</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col p-4">
<h1 class="text-xl font-bold mb-1 text-center">💪 筋肥大ボリュームロガー</h1>
<p class="text-gray-400 text-sm mb-4 text-center">セット × レップ × 重量でトレーニング量を記録・追跡</p>

<div class="max-w-2xl mx-auto w-full">
  <div class="bg-gray-800 rounded-xl p-4 mb-4">
    <h2 class="text-sm font-bold text-gray-300 mb-3">セット記録</h2>
    <div class="flex flex-wrap gap-2 mb-3">
      <label class="flex flex-col text-xs text-gray-400 flex-1 min-w-24">
        種目
        <select id="exercise" class="mt-1 bg-gray-700 border border-gray-600 rounded px-2 py-1.5 text-sm">
          <option>ベンチプレス</option>
          <option>スクワット</option>
          <option>デッドリフト</option>
          <option>ショルダープレス</option>
          <option>ラットプルダウン</option>
          <option>バーベルロウ</option>
          <option>ダンベルカール</option>
          <option>トライセプスプレスダウン</option>
          <option>レッグプレス</option>
          <option>その他</option>
        </select>
      </label>
      <label class="flex flex-col text-xs text-gray-400 w-20">
        重量(kg)
        <input id="weight" type="number" value="60" min="0" step="2.5" class="mt-1 bg-gray-700 border border-gray-600 rounded px-2 py-1.5 text-sm">
      </label>
      <label class="flex flex-col text-xs text-gray-400 w-16">
        レップ
        <input id="reps" type="number" value="10" min="1" max="100" class="mt-1 bg-gray-700 border border-gray-600 rounded px-2 py-1.5 text-sm">
      </label>
      <label class="flex flex-col text-xs text-gray-400 w-14">
        RIR
        <input id="rir" type="number" value="2" min="0" max="5" class="mt-1 bg-gray-700 border border-gray-600 rounded px-2 py-1.5 text-sm" title="Reps In Reserve">
      </label>
    </div>
    <button id="addSet" class="w-full bg-blue-600 hover:bg-blue-500 rounded px-4 py-2 text-sm font-bold transition">+ セット追加</button>
  </div>

  <div class="bg-gray-800 rounded-xl p-4 mb-4">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-sm font-bold text-gray-300">本日のセット</h2>
      <div class="text-xs text-gray-500 font-mono">ボリューム: <span id="totalVolume" class="text-yellow-400 font-bold">0</span> kg</div>
    </div>
    <div id="setList" class="space-y-1 max-h-48 overflow-auto"></div>
  </div>

  <div class="bg-gray-800 rounded-xl p-4 mb-4">
    <h2 class="text-sm font-bold text-gray-300 mb-3">種目別サマリ（本日）</h2>
    <div id="summary" class="space-y-2"></div>
  </div>

  <div class="bg-gray-800 rounded-xl p-4">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-sm font-bold text-gray-300">週間ボリューム推移</h2>
      <button id="clearToday" class="text-xs text-red-400 hover:text-red-300">本日クリア</button>
    </div>
    <canvas id="chart" height="120" class="w-full"></canvas>
  </div>
</div>

<script>
const STORAGE_KEY='hypertrophy-log-v1';
let log=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
const today=new Date().toISOString().slice(0,10);
if(!log[today]) log[today]=[];

function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(log)); }

function addSet(){
  const ex=document.getElementById('exercise').value;
  const w=parseFloat(document.getElementById('weight').value)||0;
  const r=parseInt(document.getElementById('reps').value)||1;
  const rir=parseInt(document.getElementById('rir').value)||0;
  log[today].push({ex,w,r,rir,ts:Date.now()});
  save(); render();
}

function render(){
  const sets=log[today];
  // Set list
  const list=document.getElementById('setList');
  if(sets.length===0){ list.innerHTML='<p class="text-xs text-gray-600 text-center py-4">セットがありません</p>'; }
  else {
    list.innerHTML=sets.map((s,i)=>`
      <div class="flex items-center gap-2 text-xs bg-gray-700 rounded px-2 py-1.5">
        <span class="font-bold text-blue-300 flex-1">${s.ex}</span>
        <span class="text-gray-300">${s.w}kg × ${s.r}rep</span>
        <span class="text-gray-500">RIR:${s.rir}</span>
        <span class="text-yellow-400 font-mono">${(s.w*s.r).toFixed(0)}kg</span>
        <button data-i="${i}" class="del-set text-red-500 hover:text-red-400">✕</button>
      </div>`).join('');
    document.querySelectorAll('.del-set').forEach(b=>{
      b.addEventListener('click',()=>{ log[today].splice(parseInt(b.dataset.i),1); save(); render(); });
    });
  }
  // Total volume
  const total=sets.reduce((s,x)=>s+x.w*x.r,0);
  document.getElementById('totalVolume').textContent=total.toLocaleString();
  // Summary by exercise
  const byEx={};
  for(const s of sets){ if(!byEx[s.ex]) byEx[s.ex]={sets:0,vol:0,maxW:0}; byEx[s.ex].sets++; byEx[s.ex].vol+=s.w*s.r; byEx[s.ex].maxW=Math.max(byEx[s.ex].maxW,s.w); }
  const sumDiv=document.getElementById('summary');
  if(Object.keys(byEx).length===0){ sumDiv.innerHTML='<p class="text-xs text-gray-600">データなし</p>'; }
  else {
    sumDiv.innerHTML=Object.entries(byEx).map(([ex,d])=>`
      <div class="flex items-center gap-2 text-xs">
        <span class="flex-1 font-bold">${ex}</span>
        <span class="text-gray-400">${d.sets}セット</span>
        <span class="text-gray-400">最大${d.maxW}kg</span>
        <span class="text-yellow-400 font-mono font-bold">${d.vol.toLocaleString()}kg</span>
      </div>`).join('');
  }
  renderChart();
}

function renderChart(){
  const cv=document.getElementById('chart');
  const ctx=cv.getContext('2d');
  cv.width=cv.offsetWidth||400; cv.height=120;
  ctx.fillStyle='#1f2937'; ctx.fillRect(0,0,cv.width,cv.height);
  // Last 7 days
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const vols=days.map(d=>(log[d]||[]).reduce((s,x)=>s+x.w*x.r,0));
  const maxV=Math.max(...vols,1);
  const pad=10, w=cv.width-pad*2, h=cv.height-30;
  const bw=w/days.length-4;
  vols.forEach((v,i)=>{
    const bh=Math.round((v/maxV)*h);
    const x=pad+i*(w/days.length)+2;
    const y=h-bh+10;
    ctx.fillStyle=days[i]===today?'#3b82f6':'#4b5563';
    ctx.fillRect(x,y,bw,bh);
    // Date label
    ctx.fillStyle='#9ca3af'; ctx.font='9px monospace';
    ctx.fillText(days[i].slice(5),x,cv.height-2);
    if(v>0){ ctx.fillStyle='#fbbf24'; ctx.font='9px sans-serif'; ctx.fillText((v/1000).toFixed(1)+'k',x,y-2); }
  });
}

document.getElementById('addSet').addEventListener('click',addSet);
document.getElementById('clearToday').addEventListener('click',()=>{ if(confirm('本日のデータを全削除?')){ log[today]=[]; save(); render(); } });
window.addEventListener('resize',renderChart);
render();
</script>
</body>
</html>
